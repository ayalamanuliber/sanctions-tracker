name: Refresh public corpus

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run update:data
      - run: npm run validate:data
      - run: npm run validate:product
      - run: npm run build

      - name: Commit validated corpus changes
        run: |
          git config user.name "ai-vortex-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No corpus changes detected."
            exit 0
          fi
          git commit -m "chore(data): refresh public corpus"
          git push
